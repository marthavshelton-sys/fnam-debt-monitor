body { background: var(--page); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 60px; padding-inline: 16px; }
header.hero { padding: 22px 4px 20px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

header.hero .ticker { color: var(--text-secondary); font-size: 13px; }

.seg { display: inline-flex; gap: 0; border: 1px solid var(--border); border-radius: 100px; overflow: hidden; background: var(--surface-1); flex-shrink: 0; }

.seg button:focus-visible { outline: 2px solid var(--s1); outline-offset: -2px; }
.seg.lang button { min-width: 44px; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 4px; flex-wrap: wrap; background: var(--page); padding: 10px 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
nav.tabs a { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); text-decoration: none; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); }
nav.tabs a:hover, nav.tabs a:focus-visible { background: var(--surface-2); color: var(--text-primary); outline: none; }
section { margin: 0 4px 44px; scroll-margin-top: 56px; }
section h2 { font-size: 17px; margin: 0 0 3px; font-weight: 700; }
section .sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 16px; max-width: 760px; line-height: 1.5; }
h3.block { font-size: 14px; margin: 24px 0 4px; }

.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 16px; }
.grid-2.even { grid-template-columns: 1fr 1fr; }

.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .kpis { grid-template-columns: 1fr; } }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.kpi .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.kpi .value { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
.kpi .delta.up { color: var(--good); }
.kpi .delta.down { color: var(--bad); }
.kpi .sub2 { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
h3.chart-title { font-size: 13px; font-weight: 700; margin: 0 0 2px; }
p.chart-note { font-size: 11.5px; color: var(--text-muted); margin: 0 0 10px; line-height: 1.45; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 10px; font-size: 11.5px; color: var(--text-secondary); }
.legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart .gridline { stroke: var(--grid); stroke-width: 1; }
svg.chart .axis { stroke: var(--axis); stroke-width: 1; }
svg.chart text.tick { fill: var(--text-muted); font-size: 10px; }
svg.chart text.tick.strong { fill: var(--text-secondary); font-weight: 600; }
.tt { position: fixed; pointer-events: none; z-index: 999; background: var(--tooltip-bg); color: var(--tooltip-fg); font-size: 11.5px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); opacity: 0; transform: translate(-50%, -110%); transition: opacity .08s ease; white-space: nowrap; }
.tt.show { opacity: 1; }
.tt b { font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .tt { transition: none; } }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 16px 0 6px; font-size: 12px; color: var(--text-secondary); }
.ctl label { font-weight: 600; }
.ctl select { font: inherit; font-size: 12px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
.ctl .custom { display: inline-flex; gap: 8px; align-items: center; }
.ctl .custom[hidden] { display: none; }
table.dtable { width: 100%; border-collapse: collapse; font-size: 12px; }
table.dtable caption { caption-side: top; text-align: left; font-size: 11.5px; color: var(--text-muted); padding: 0 0 8px; line-height: 1.5; white-space: normal; }
table.dtable th, table.dtable td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; vertical-align: top; }
table.dtable th:first-child, table.dtable td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
table.dtable thead th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; border-bottom: 1px solid var(--axis); }
table.dtable tbody tr:hover td { background: var(--surface-2); }
table.dtable td.pos { color: var(--good); }
table.dtable td.neg { color: var(--bad); }
table.dtable tr.section-row td { font-weight: 700; background: var(--surface-2); }
table.dtable tr.sub-row td { font-style: italic; color: var(--text-muted); font-size: 11px; }

table.dtable td.cmt, table.dtable th.cmt { text-align: left; white-space: normal; min-width: 300px; max-width: 420px; font-size: 11px; line-height: 1.45; color: var(--text-secondary); font-style: normal; font-weight: 400; }
table.dtable tr.section-row td.cmt { font-weight: 400; }
.tblwrap { overflow-x: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; }
.tblwrap table.dtable { min-width: 920px; }
.tblwrap.wide table.dtable { min-width: 1180px; }
.note-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-top: 14px; }
footer.foot { margin: 40px 4px 0; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); line-height: 1.7; }
</style>

is_note1: "<b>\"Total operating income\" is not a reported line.</b> Gentera's income statement (CNBV format) runs interest income &rarr; financial margin &rarr; provisions &rarr; financial margin after provisions &rarr; fees, trading and other income &rarr; opex &rarr; operating result. The dashboard adds two aggregates for a top-line view: <b>total operating income (pre-provision)</b> = financial margin + net fees + trading result + other operating income, and <b>operating income after provisions</b> = the same less loan-loss provisions. The second one is exactly the denominator of Gentera's own efficiency ratio, which is why that ratio (64.5% in 2Q26) is far above opex / pre-provision income (47.5%).",
is_note2: "<b>Ratios as disclosed vs. recomputed:</b> for a single quarter, NIM, NIM after provisions, efficiency ratio, operating efficiency, ROAA, ROAE and ROAE (controlling) are Gentera's own published figures. For multi-quarter periods (YTD, fiscal year, LTM) the efficiency ratios, ROAA and ROAE are recomputed from period sums and average balances in the way Gentera builds its own YTD figures (they reproduce the published 6M26 and FY2025 numbers), while NIM and NIM after provisions are the simple average of the quarterly disclosed figures because Gentera's productive-asset denominator is not published. Three ratios are recomputed for every period: <b>cost of risk</b> (annualized provisions / average gross loans &mdash; reproduces Gentera's published 14.5% for 2Q26 and 13.7% for 6M26), <b>portfolio yield</b> (annualized interest income / average gross loans; Gentera's own \"tasa activa\", published only since 4Q23, is shown as a separate row and runs ~1&ndash;2 pts higher because of different averaging), and <b>coverage</b> (see the asset-quality footnote). Interest expense includes loan-origination costs and lease interest that Gentera books there under the 2022 accounting criteria; the \"funding cost\" sub-line strips those out.",
is_note3: "<b>Comments column:</b> for the default quarter view, the year-to-date view and the fiscal-year view the explanations are written from Gentera's own management discussion in the 2Q26, 1Q26 and 4Q25 releases plus the driver arithmetic on this page. For LTM and custom comparisons the column is generated from the same drivers (portfolio growth, yield, cost of funds, provisions, fee volumes, opex, tax rate and the ConCr&eacute;dito minority buyouts), so it stays factual but is necessarily more mechanical.",

bs_note: "<b>ConCr&eacute;dito buyouts and minority interest:</b> non-controlling interest fell from Ps.&nbsp;3,187m (2Q22) to Ps.&nbsp;1,953m (3Q22) when Gentera invested Ps.&nbsp;1,991.7m on August&nbsp;15, 2022 to lift its ConCr&eacute;dito stake from 57.53% to 74.91% (Ps.&nbsp;1,244.6m reduction in minority interest plus a Ps.&nbsp;747.1m premium charged to share premium), and again from Ps.&nbsp;2,419m (1Q25) to Ps.&nbsp;234m (2Q25) when it completed the purchase of the remaining ~25.1% on June&nbsp;30, 2025 (share premium moved from Ps.&nbsp;&minus;455m to Ps.&nbsp;&minus;1,030m). Neither step changes consolidated assets, revenue or net income, but both lift the controlling share of profit. Goodwill of Ps.&nbsp;4,573m is ConCr&eacute;dito (Ps.&nbsp;3,853m) and Compartamos Banco Per&uacute; (Ps.&nbsp;664m). Gentera has no \"current vs. non-current\" split, so the liquidity metric shown is cash &amp; investments as a share of assets.",

c_eff_t: "Razones de eficiencia", c_eff_n: "%, los 10 trimestres. &Iacute;ndice de eficiencia de Gentera = gastos de operaci&oacute;n / ingresos de la operaci&oacute;n despu&eacute;s de provisiones; \"eficiencia operativa\" = gastos anualizados / activos totales promedio.",

p_ytd: "Acumulado del a&ntilde;o: 6M26 vs. 6M25",
p_fy: "&Uacute;ltimo ejercicio fiscal: 2025 vs. 2024",
p_ltm: "&Uacute;ltimos doce meses: UDM 2T26 vs. UDM 2T25",
p_custom: "Personalizado: cualquier trimestre vs. cualquier trimestre",
ctl_vs: "vs.",
is_note1: "<b>\"Ingresos totales de la operaci&oacute;n\" no es una partida reportada.</b> El estado de resultados de Gentera (formato CNBV) va de ingresos por intereses &rarr; margen financiero &rarr; provisiones &rarr; margen financiero ajustado por riesgos &rarr; comisiones, intermediaci&oacute;n y otros ingresos &rarr; gastos &rarr; resultado de la operaci&oacute;n. El tablero agrega dos totales para una vista de \"l&iacute;nea superior\": <b>ingresos totales de la operaci&oacute;n (antes de provisiones)</b> = margen financiero + comisiones netas + resultado por intermediaci&oacute;n + otros ingresos de la operaci&oacute;n, e <b>ingresos de la operaci&oacute;n despu&eacute;s de provisiones</b> = lo mismo menos la estimaci&oacute;n preventiva. El segundo es exactamente el denominador del &iacute;ndice de eficiencia de Gentera, por lo que ese &iacute;ndice (64.5% en el 2T26) queda muy por encima de gastos / ingresos antes de provisiones (47.5%).",
is_note2: "<b>Razones reportadas vs. recalculadas:</b> para un trimestre individual, MIN, MIN despu&eacute;s de provisiones, &iacute;ndice de eficiencia, eficiencia operativa, ROAA, ROAE y ROAE (controladora) son las cifras publicadas por Gentera. Para periodos de varios trimestres (acumulado, ejercicio fiscal, UDM) las razones de eficiencia, ROAA y ROAE se recalculan con sumas del periodo y saldos promedio tal como Gentera construye sus cifras acumuladas (reproducen las cifras publicadas de 6M26 y 2025), mientras que el MIN y el MIN despu&eacute;s de provisiones son el promedio simple de las cifras trimestrales porque el denominador de activos productivos de Gentera no se publica. Tres razones se recalculan en todos los periodos: <b>costo de riesgo</b> (provisiones anualizadas / cartera bruta promedio &mdash; reproduce el 14.5% publicado para el 2T26 y el 13.7% para 6M26), <b>tasa activa</b> (ingresos por intereses anualizados / cartera bruta promedio; la \"tasa activa\" de Gentera, publicada s&oacute;lo desde el 4T23, aparece en una fila aparte y es ~1&ndash;2 puntos mayor por un promedio distinto) y <b>cobertura</b> (v&eacute;ase la nota de calidad de activos). Los gastos por intereses incluyen costos de originaci&oacute;n de cr&eacute;dito e intereses de arrendamiento que Gentera registra ah&iacute; bajo los criterios contables de 2022; la subl&iacute;nea de \"costo de fondeo\" los excluye.",
is_note3: "<b>Columna de comentarios:</b> para la vista trimestral predeterminada, la vista acumulada y la vista de ejercicio fiscal, las explicaciones se redactaron a partir de los comentarios de la administraci&oacute;n en los reportes del 2T26, 1T26 y 4T25 m&aacute;s la aritm&eacute;tica de impulsores de esta p&aacute;gina. Para UDM y comparaciones personalizadas la columna se genera con los mismos impulsores (crecimiento de cartera, tasa activa, costo de fondeo, provisiones, volumen de comisiones, gastos, tasa impositiva y las compras de minoritarios de ConCr&eacute;dito), por lo que se mantiene factual pero es necesariamente m&aacute;s mec&aacute;nica.",
bs_h2: "Balance",
bs_sub: "Estado de situaci&oacute;n financiera consolidado a cada cierre de trimestre, m&aacute;s m&eacute;tricas de apalancamiento y liquidez.",
c_bs_t: "Activos, pasivos y capital", c_bs_n: "Ps. millones, saldos al cierre del trimestre.",
c_ratio_t: "Apalancamiento y cartera a dep&oacute;sitos", c_ratio_n: "Pasivo total / capital, y cartera bruta / captaci&oacute;n de clientes (x).",
bs_note: "<b>Compras de ConCr&eacute;dito y participaci&oacute;n no controladora:</b> la participaci&oacute;n no controladora baj&oacute; de Ps.&nbsp;3,187 millones (2T22) a Ps.&nbsp;1,953 millones (3T22) cuando Gentera invirti&oacute; Ps.&nbsp;1,991.7 millones el 15 de agosto de 2022 para subir su participaci&oacute;n en ConCr&eacute;dito de 57.53% a 74.91% (reducci&oacute;n de Ps.&nbsp;1,244.6 millones en la participaci&oacute;n minoritaria m&aacute;s una prima de Ps.&nbsp;747.1 millones cargada a la prima en venta de acciones), y de nuevo de Ps.&nbsp;2,419 millones (1T25) a Ps.&nbsp;234 millones (2T25) cuando concluy&oacute; la compra del ~25.1% restante el 30 de junio de 2025 (la prima pas&oacute; de Ps.&nbsp;&minus;455 millones a Ps.&nbsp;&minus;1,030 millones). Ninguno de los dos pasos cambia los activos, ingresos o utilidad neta consolidados, pero ambos elevan la parte controladora de la utilidad. El cr&eacute;dito mercantil de Ps.&nbsp;4,573 millones corresponde a ConCr&eacute;dito (Ps.&nbsp;3,853 millones) y Compartamos Banco Per&uacute; (Ps.&nbsp;664 millones). Gentera no separa \"circulante vs. no circulante\", por lo que la m&eacute;trica de liquidez mostrada es efectivo e inversiones como proporci&oacute;n de los activos.",
aq_h2: "Calidad de activos, fondeo y capital",
aq_sub: "Sustituye la pesta&ntilde;a de flujo de efectivo de la plantilla de GAP: para una microfinanciera las preguntas anal&iacute;ticas son la calidad crediticia, c&oacute;mo se fondea la cartera y cu&aacute;nto capital la respalda.",
c_npl_t: "&Iacute;ndice de cartera etapa 3 (vencida) por subsidiaria", c_npl_n: "% de la cartera bruta de cada subsidiaria, 1T22&ndash;2T26, como se reporta. Banco Compartamos castiga a los 180 d&iacute;as de atraso.",
c_cor_t: "Costo de riesgo", c_cor_n: "%, 1T22&ndash;2T26. Estimaci&oacute;n preventiva anualizada / cartera bruta promedio (calculado; igual a la cifra publicada por Gentera desde el 2T24).",
c_cov_t: "&Iacute;ndice de cobertura", c_cov_n: "Estimaci&oacute;n preventiva / cartera etapa 3, %, 1T22&ndash;2T26, recalculado con la definici&oacute;n vigente de Gentera para todos los trimestres.",
c_wo_t: "Castigos por trimestre", c_wo_n: "Ps. millones, consolidado, de la tabla de cartera de cada reporte.",
c_fund_t: "Mezcla de fondeo", c_fund_n: "Ps. millones, apilado, cierre de trimestre, 1T22&ndash;2T26: captaci&oacute;n tradicional, t&iacute;tulos de cr&eacute;dito emitidos (certificados burs&aacute;tiles), pr&eacute;stamos interbancarios y de banca de desarrollo, y obligaciones en bursatilizaci&oacute;n.",
c_cof_t: "Costo de fondeo por subsidiaria", c_cof_n: "%, como lo reporta Gentera para Banco Compartamos (M&eacute;xico) y Compartamos Banco Per&uacute;, 1T22&ndash;2T26.",
c_cap_t: "Capital", c_cap_n: "%, 1T22&ndash;2T26: &iacute;ndice de capitalizaci&oacute;n de Banco Compartamos (ICAP, Basilea III), &iacute;ndice de solvencia de Compartamos Banco Per&uacute; y capital / activos totales consolidado de Gentera.",
aq_note: "<b>La definici&oacute;n del &iacute;ndice de cobertura cambi&oacute; en el 4T25.</b> Hasta el 3T25 los reportes de Gentera imprim&iacute;an un &iacute;ndice de cobertura consolidado de 400&ndash;750% (p. ej. 478.2% para el 2T25); desde el reporte del 4T25 la misma m&eacute;trica es estimaci&oacute;n preventiva / cartera etapa 3 (222.0% para el 4T25, con el 2T25 reexpresado a 238.2% en el reporte del 2T26). Todas las cifras de cobertura de esta p&aacute;gina se recalculan con esa definici&oacute;n vigente a partir de la estimaci&oacute;n y la cartera etapa 3 del balance, por lo que la serie es consistente en los 18 trimestres. Los &iacute;ndices de etapa 3 por subsidiaria son los reportados. Los castigos de Banco Compartamos se derivan como consolidado menos Per&uacute; menos ConCr&eacute;dito (por lo que incluyen la peque&ntilde;a cartera de Yast&aacute;s); la cifra narrativa de Gentera para el Banco (p. ej. Ps.&nbsp;2,325 millones en el 2T26) concilia dentro de Ps.&nbsp;1 mill&oacute;n.",
val_h2: "Valuaci&oacute;n",
val_sub: "Los fundamentales por acci&oacute;n provienen de los datos de la compa&ntilde;&iacute;a en esta p&aacute;gina. Las cifras de mercado (precio, capitalizaci&oacute;n, m&uacute;ltiplos, estimaciones de consenso) est&aacute;n dise&ntilde;adas para alimentarse de FactSet; hasta que ese conector est&eacute; activo esas celdas dicen \"pendiente de FactSet\" en lugar de mostrar un n&uacute;mero desactualizado o capturado a mano.",
c_eps_t: "UPA por trimestre y &uacute;ltimos doce meses", c_eps_n: "Ps. por acci&oacute;n, utilidad neta controladora / acciones en circulaci&oacute;n, 1T22&ndash;2T26 (datos de la compa&ntilde;&iacute;a).",
c_px_t: "Precio de la acci&oacute;n y precio a valor en libros", c_px_n: "Precio al cierre del trimestre (Ps.) y P/VL (x) &mdash; se dibuja cuando el feed de FactSet entregue precios de cierre de trimestre.",
val_note: "<b>Contrato del feed de FactSet.</b> La p&aacute;gina lee un objeto, <code>FACTSET</code>, con: <code>asOf</code> (fecha), <code>price</code> (Ps.), <code>sharesOut</code> (millones, opcional; por defecto la cifra de la compa&ntilde;&iacute;a), <code>consensus</code> (<code>epsFY1</code>, <code>epsFY2</code>, <code>bvpsFY1</code>, <code>dpsFY1</code>, <code>targetPrice</code>, <code>rating</code>) e <code>history</code> (arreglo de <code>{q:\"2Q26\", price:...}</code> a cierres de trimestre). Todo lo dem&aacute;s en esta pesta&ntilde;a &mdash; capitalizaci&oacute;n, P/U sobre UPA de doce meses y estimada, P/VL, rendimiento del dividendo, potencial impl&iacute;cito &mdash; se calcula en la p&aacute;gina con esos insumos y los fundamentales de la compa&ntilde;&iacute;a, de modo que los m&uacute;ltiplos siempre son consistentes con la UPA y el valor en libros mostrados arriba. Nada de esto es una recomendaci&oacute;n.",
footer: "Fuentes: reportes trimestrales de resultados de Gentera (1T22 &ndash; 2T26), descargados de gentera.com.mx/gentera/relacion-inversionistas/informacion_trimestral; las cifras de cada trimestre se toman de su propio reporte y se cotejan con las columnas comparativas de los reportes del trimestre y del a&ntilde;o siguientes (sin reexpresiones materiales salvo la redefinici&oacute;n del &iacute;ndice de cobertura ya se&ntilde;alada). Todas las cifras son no auditadas, tal como las report&oacute; la Compa&ntilde;&iacute;a. Datos de mercado: FactSet (conector pendiente). Tablero compilado como referencia por Talipot; no constituye asesor&iacute;a de inversi&oacute;n. Generado el {{BUILD_DATE}}.",

  var Pz=getPeriods(),Aa=Pz.A,Bb=Pz.B,Cc=Pz.C,three=!!Cc;
  var head='<caption>'+t('cap_is')+'</caption><thead><tr><th>'+t('th_line')+'</th><th>'+Aa.label+'</th><th>'+Bb.label+'</th><th>'+(three?t('th_chg_yoy'):t('th_chg'))+'</th>'+(three?'<th>'+Cc.label+'</th><th>'+t('th_chg_qoq')+'</th>':'')+'<th class="cmt">'+t('th_cmt')+'</th></tr></thead>';
  var body=SPEC.map(function(r){ var a=r[3](Aa),b=r[3](Bb),c=three?r[3](Cc):null;
    return '<tr class="'+(r[4]||'')+'"><td>'+t(r[1])+'</td><td>'+fmtK(a,r[2])+'</td><td>'+fmtK(b,r[2])+'</td>'+chgCell(a,b,r[2])+(three?'<td>'+fmtK(c,r[2])+'</td>'+chgCell(a,c,r[2]):'')+'<td class="cmt">'+comment(r[0],Aa,Bb)+'</td></tr>'; }).join('');
  document.getElementById('tblIncome').innerHTML=head+'<tbody>'+body+'</tbody>';
}

/* ---------- balance sheet & asset quality tables ---------- */
function renderBalance(){ var h='<caption>'+t('cap_bs')+'</caption><thead><tr><th>'+t('th_line')+'</th>'+QD.map(function(d){return '<th>'+d.q+'</th>';}).join('')+'</tr></thead>';
  var rows=[['b_cash','cash'],['b_l12','loans12','item-row'],['b_l3','loans3','item-row'],['b_loans','loans','section-row'],['b_def','deferred','item-row'],['b_allow','allow','item-row',true],['b_lnet','loansNet'],['b_gw','goodwill'],['b_oa','otherAssetsResid'],['b_ta','totAssets','section-row'],
    ['b_dep','deposits'],['b_debt','debtSec'],['b_bank','bankLoans'],['b_sec','securit'],['b_lease','leaseLiab'],['b_ol','otherLiabResid'],['b_tl','totLiab','section-row'],['b_eqc','eqCtrl'],['b_eqm','eqMin'],['b_te','totEq','section-row']];
  var b='<tbody>'+rows.map(function(r){ return '<tr class="'+(r[2]||'')+'"><td>'+t(r[0])+'</td>'+QD.map(function(d){ var v=d[r[1]]; return '<td>'+(r[3]?'('+fmtMM(v)+')':fmtMM(v))+'</td>'; }).join('')+'</tr>'; }).join('');
  var ratio=function(lk,fn){ return '<tr class="sub-row"><td>'+t(lk)+'</td>'+QD.map(function(d){return '<td>'+fn(d)+'</td>';}).join('')+'</tr>'; };
  b+=ratio('b_r1',function(d){return d.eqAssets.toFixed(1)+'%';})+ratio('b_r2',function(d){return d.lev.toFixed(2)+'x';})+ratio('b_r3',function(d){return d.ltd.toFixed(2)+'x';})+ratio('b_r4',function(d){return d.cashAssets.toFixed(1)+'%';})+ratio('b_r5',function(d){return d.bvps.toFixed(2);})+'</tbody>';
  document.getElementById('tblBalance').innerHTML=h+b; }
function renderAQ(){ var h='<caption>'+t('cap_aq')+'</caption><thead><tr><th>'+t('th_metric')+'</th>'+QD.map(function(d){return '<th>'+d.q+'</th>';}).join('')+'</tr></thead>';
  var row=function(lk,fn,cls){ return '<tr class="'+(cls||'')+'"><td>'+t(lk)+'</td>'+QD.map(function(d){var v=fn(d);return '<td>'+(v==null?'n/a':v)+'</td>';}).join('')+'</tr>'; };
  var p2=function(k){return function(d){return d[k]==null?null:d[k].toFixed(2)+'%';};},p1=function(k){return function(d){return d[k]==null?null:d[k].toFixed(1)+'%';};},mm=function(k){return function(d){return d[k]==null?null:fmtMM(d[k]);};};
  var b='<tbody>'+row('a_s3',mm('loans3'),'section-row')+row('a_npl',p2('npl'),'sub-row')+row('a_nplmx',p2('nplMX'),'sub-row')+row('a_nplpe',p2('nplPE'),'sub-row')+row('a_nplcc',p2('nplCC'),'sub-row')+row('a_allow',mm('allow'))+row('a_cov',p1('covCalc'),'sub-row')+row('a_prov',mm('prov'))+row('a_cor',p1('corCalc'),'sub-row')
    +row('a_wo',mm('writeoffs'),'section-row')+row('a_womx',mm('woMX'),'item-row')+row('a_wope',mm('woPE'),'item-row')+row('a_wocc',mm('woCC'),'item-row')+row('a_dep',mm('deposits'),'section-row')+row('a_debt',mm('debtSec'),'item-row')+row('a_bank',mm('bankLoans'),'item-row')+row('a_sec',mm('securit'),'item-row')
    +row('a_ltd',function(d){return d.ltd.toFixed(2)+'x';},'sub-row')+row('a_cofmx',p1('cofMX'),'sub-row')+row('a_cofpe',p1('cofPE'),'sub-row')+row('a_icap',p1('icap'),'section-row')+row('a_solv',p1('solvPE'))+row('a_eqa',p1('eqAssets'))+'</tbody>';
  document.getElementById('tblAQ').innerHTML=h+b; }

/* ---------- valuation (FactSet-fed) ---------- */
function renderVal(){ var row=document.getElementById('kpiVal'); row.innerHTML=''; var F=(typeof FACTSET!=='undefined')?FACTSET:null, px=(F&&F.price!=null)?F.price:null, sh=(F&&F.sharesOut)?F.sharesOut:CUR.shares, pend=t('k_pending'), ps=t('k_pending_s'), asof=F&&F.asOf?tf('asof',{d:F.asOf}):ps;
  [{label:t('k_px'),val:px!=null?'Ps. '+px.toFixed(2):pend,sub:asof},{label:t('k_mcap'),val:px!=null?'Ps. '+fmtMM(px*sh)+'M':pend,sub:asof},
   {label:t('k_pe'),val:px!=null?(px/CUR.epsTTM).toFixed(1)+'x':pend,sub:tf('k_pe_s',{e:CUR.epsTTM.toFixed(2)})},{label:t('k_pbv'),val:px!=null?(px/CUR.bvps).toFixed(2)+'x':pend,sub:tf('k_pbv_s',{b:CUR.bvps.toFixed(2)})},
   {label:t('k_dy'),val:px!=null?(CUR.dps/px*100).toFixed(1)+'%':pend,sub:tf('k_dy_s',{d:CUR.dps.toFixed(2)})}].forEach(function(it){kpi(row,it);});
  var hist={}; if(F&&F.history) F.history.forEach(function(h){hist[h.q]=h.price;});
  var pxOf=function(d){ return hist[d.q]!=null?hist[d.q]:(d===CUR&&px!=null?px:null); };
  var h='<caption>'+t('cap_val')+'</caption><thead><tr><th>'+t('th_metric')+'</th>'+QD.map(function(d){return '<th>'+d.q+'</th>';}).join('')+'</tr></thead>';
  var r=function(lk,fn,cls){ return '<tr class="'+(cls||'')+'"><td>'+t(lk)+'</td>'+QD.map(function(d){var v=fn(d);return '<td>'+(v==null?t('v_pending'):v)+'</td>';}).join('')+'</tr>'; };
  var b='<tbody>'+r('v_eps',function(d){return d.eps.toFixed(2);})+r('v_epsttm',function(d){return d.epsTTM.toFixed(2);})+r('v_bvps',function(d){return d.bvps.toFixed(2);})+r('v_dps',function(d){return d.dps.toFixed(2);})
    +r('v_px',function(d){var p=pxOf(d);return p==null?null:p.toFixed(2);},'section-row')+r('v_mcap',function(d){var p=pxOf(d);return p==null?null:fmtMM(p*d.shares);})+r('v_pe',function(d){var p=pxOf(d);return p==null?null:(p/d.epsTTM).toFixed(1)+'x';})+r('v_pbv',function(d){var p=pxOf(d);return p==null?null:(p/d.bvps).toFixed(2)+'x';})+r('v_dy',function(d){var p=pxOf(d);return p==null?null:(d.dps/p*100).toFixed(1)+'%';});
  var cs=F&&F.consensus?F.consensus:{}, one=function(lk,v){ return '<tr class="item-row"><td>'+t(lk)+'</td><td colspan="'+QD.length+'" style="text-align:left">'+(v==null?t('v_pending'):v)+'</td></tr>'; };
  b+='<tr class="section-row"><td>'+t('v_cons')+'</td><td colspan="'+QD.length+'"></td></tr>'+one('v_epsfy1',cs.epsFY1!=null?cs.epsFY1.toFixed(2):null)+one('v_epsfy2',cs.epsFY2!=null?cs.epsFY2.toFixed(2):null)+one('v_pefy1',(px!=null&&cs.epsFY1)?(px/cs.epsFY1).toFixed(1)+'x':null)+one('v_tp',cs.targetPrice!=null?cs.targetPrice.toFixed(2):null)+one('v_up',(px!=null&&cs.targetPrice)?sgn((cs.targetPrice/px-1)*100)+'%':null)+'</tbody>';
  document.getElementById('tblVal').innerHTML=h+b; }

/* ---------- wiring ---------- */
function renderAll(){ applyStatic(); renderKPIs(); renderCharts(); renderIncome(); renderBalance(); renderAQ(); renderVal(); }
function setLang(l){ LANG=l; try{localStorage.setItem('gentera_lang',l);}catch(e){} document.getElementById('langEn').setAttribute('aria-pressed',l==='en'?'true':'false'); document.getElementById('langEs').setAttribute('aria-pressed',l==='es'?'true':'false'); renderAll(); }
document.getElementById('langEn').addEventListener('click',function(){setLang('en');}); document.getElementById('langEs').addEventListener('click',function(){setLang('es');});
var selP=document.getElementById('periodSel'), selA=document.getElementById('selA'), selB=document.getElementById('selB');
Q.forEach(function(d,i){ var o=document.createElement('option'); o.value=i; o.textContent=d.q; selA.appendChild(o); var o2=o.cloneNode(true); selB.appendChild(o2); });
selA.value=CUSTOM.a; selB.value=CUSTOM.b;
selP.addEventListener('change',function(){ PRESET=selP.value; document.getElementById('customPick').hidden=PRESET!=='custom'; renderIncome(); });
selA.addEventListener('change',function(){ CUSTOM.a=parseInt(selA.value,10); renderIncome(); }); selB.addEventListener('change',function(){ CUSTOM.b=parseInt(selB.value,10); renderIncome(); });
document.getElementById('langEn').setAttribute('aria-pressed',LANG==='en'?'true':'false'); document.getElementById('langEs').setAttribute('aria-pressed',LANG==='es'?'true':'false');
renderAll();

})();

</script>
