# Temporary: fetch a few public pages from a GitHub runner (the dev sandbox cannot reach them) and commit the text.
name: Fetch reference pages (temporary)
on:
  workflow_dispatch:
  push:
    branches: ["claude/gap-financial-model-vfypi1"]
    paths: [".github/workflows/site-check.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - name: Fetch
        shell: bash
        run: |
          mkdir -p tools/gap/probe; O=tools/gap/probe/fibra.txt; : > "$O"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          strip() { python3 - "$1" <<'PY'
          import sys,re,html
          t=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'<title>(.*?)</title>',t,re.S|re.I); print('TITLE:', html.unescape(m.group(1)).strip() if m else '')
          for k in ('datePublished','article:published_time','dateModified'):
              mm=re.search(k+r'["\']?\s*[:=]\s*["\']([^"\']+)',t)
              if mm: print(k+':', mm.group(1))
          t=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',t); t=re.sub(r'<[^>]+>','\n',t); t=html.unescape(t)
          lines=[l.strip() for l in t.split('\n')]; lines=[l for l in lines if len(l)>60]
          print('\n'.join(lines[:80]))
          PY
          }
          for u in "https://es-us.noticias.yahoo.com/octubre-saldr%C3%A1-fibra-gap-033454232.html" "https://es-us.noticias.yahoo.com/gap-pospone-colocaci%C3%B3n-fibra-planeada-021631777.html" "https://www.aeropuertosgap.com.mx/es/material-events.html" "https://www.aeropuertosgap.com.mx/en/investors/material-events.html" "https://www.globenewswire.com/search/keyword/FIBRA%20GAP" "https://www.globenewswire.com/search/organization/Grupo%20Aeroportuario%20del%20Pacifico"; do
            echo "==== $u" >> "$O"; curl -sSL -m 60 -A "$UA" -o /tmp/page.html -w "http %{http_code}\n" "$u" >> "$O" 2>&1 || echo "curl failed" >> "$O"
            strip /tmp/page.html >> "$O" 2>&1 || true
          done
          # GAP's recent 6-K index on EDGAR (JSON), titles only
          echo "==== EDGAR recent filings" >> "$O"; curl -sS -m 60 -A "fnam.mx research contact@fnam.mx" "https://data.sec.gov/submissions/CIK0001347557.json" -o /tmp/sub.json && python3 - <<'PY' >> "$O"
          import json; d=json.load(open('/tmp/sub.json')); r=d['filings']['recent']
          for i in range(min(25,len(r['form']))): print(r['filingDate'][i], r['form'][i], r.get('primaryDocument',[''])[i], (r.get('primaryDocDescription') or [''])[i])
          PY
          wc -c "$O"
      - name: Commit
        run: |
          git config user.name "fnam-data-bot" && git config user.email "actions@users.noreply.github.com"
          git add tools/gap/probe && git commit -m "gap: reference probe $(date -u '+%Y-%m-%d %H:%M') UTC [skip actions]" && git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}"
