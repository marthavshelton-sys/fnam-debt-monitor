# Data-refresh watchdog. Every 12 hours (03:50 and 15:50 UTC: 21:50 and 09:50 in Mexico City, each just after a
# batch of refreshes) it checks that each dashboard's scheduled refresh has landed on time
# (scripts/watchdog/check.mjs; dashboards, grace and heartbeat in tools/watchdog/dashboards.json; runbook
# tools/watchdog/README.md) and writes site/status/refresh.json, which the landing page's "Last successful
# data refresh" panel and the status dot on each company page read. A dashboard is shown as up to date
# ("Al día") only while this check says so; the site calls nothing "live".
#
# A dashboard whose last scheduled refresh failed or never ran (3 h grace after its due time) is late; since
# 9-Oct-2026 one miss is enough, so a failed nightly run shows on the site the same evening. If its own
# pipeline has no alert open, one "SOURCE DOWN: watchdog - <dashboard> refresh late" issue (label data-watchdog)
# is opened, which the owner's email routine sends like every "SOURCE DOWN: " issue; the first on-time check
# comments and closes it. A dashboard with price feeds listed in dashboards.json (Oracle) is "stale" when
# any of them is behind the exchange's last completed session (red, pulsing on the site) and gets one
# "SOURCE DOWN: watchdog - <dashboard> prices stale" issue, closed when every feed is current again.
#
# Read-only on every other workflow. Commits only site/status/refresh.json, rewritten at every check (it
# changes, or its time stamp is 11 hours old), about two deploys a day; the pages treat a stamp older than
# 14 hours as unverified, so a silent watchdog never leaves a stale "Al día" behind.
name: Data refresh watchdog

on:
  schedule:
    - cron: "50 3,15 * * *"   # every 12 hours, after the evening and the morning refreshes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: write no status file, open or close no issue"
        type: boolean
        default: false

concurrency:
  group: data-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the watchdog rules
        run: node scripts/watchdog/selftest.mjs

      - name: Check every scheduled refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog/check.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the status file if it changed
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          git config user.name "data-watchdog[bot]"
          git config user.email "data-watchdog@users.noreply.github.com"
          git add site/status/refresh.json
          if git diff --cached --quiet; then
            echo "Status unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "watchdog: data status $(date -u +%Y-%m-%d\ %H:%M) UTC [skip actions]"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push failed; rebasing and retrying ($i)"
            git pull --rebase origin main || true
            sleep $((i * 5))
          done
          exit 1
