# Data-refresh watchdog. Every hour it checks that each dashboard's scheduled refresh has landed on time
# (scripts/watchdog/check.mjs; dashboards, grace and heartbeat in tools/watchdog/dashboards.json; runbook
# tools/watchdog/README.md) and writes site/status/refresh.json, which the landing page's "Last successful
# data refresh" panel and the status dot on each company page read. A dashboard is shown as up to date
# ("Al día") only while this check says so; the site calls nothing "live".
#
# A dashboard whose last two scheduled refreshes both failed or never ran is late. If its own pipeline has
# no alert open, one "SOURCE DOWN: watchdog - <dashboard> refresh late" issue (label data-watchdog) is
# opened, which the owner's email routine sends like every "SOURCE DOWN: " issue; the first on-time check
# comments and closes it.
#
# Read-only on every other workflow. Commits only site/status/refresh.json, and only when it changed or
# every four hours as a heartbeat, so the pages can tell a silent watchdog from a quiet night.
name: Data refresh watchdog

on:
  schedule:
    - cron: "12 * * * *"   # hourly at :12, a minute no refresh uses
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: write no status file, open or close no issue"
        type: boolean
        default: false

concurrency:
  group: data-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the watchdog rules
        run: node scripts/watchdog/selftest.mjs

      - name: Check every scheduled refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog/check.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the status file if it changed
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          git config user.name "data-watchdog[bot]"
          git config user.email "data-watchdog@users.noreply.github.com"
          git add site/status/refresh.json
          if git diff --cached --quiet; then
            echo "Status unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "watchdog: data status $(date -u +%Y-%m-%d\ %H:%M) UTC [skip actions]"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push failed; rebasing and retrying ($i)"
            git pull --rebase origin main || true
            sleep $((i * 5))
          done
          exit 1
