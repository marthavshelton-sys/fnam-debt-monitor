# Data-refresh watchdog. Every 12 hours (03:50 and 15:50 UTC: 21:50 and 09:50 in Mexico City, each just after a
# batch of refreshes) it checks that each dashboard's scheduled refresh has landed on time
# (scripts/watchdog/check.mjs; dashboards, grace and heartbeat in tools/watchdog/dashboards.json; runbook
# tools/watchdog/README.md) and writes site/status/refresh.json, which the landing page's "Last successful
# data refresh" panel and the status dot on each company page read. A dashboard is shown as up to date
# ("Al día") only while this check says so; the site calls nothing "live".
#
# A dashboard whose last scheduled refresh failed or never ran (graceHours in dashboards.json after its due time: 12 h
# since 16-Oct-2026, because GitHub started this repository's schedules three to seven hours late in the week of
# 13-Oct-2026 and every dashboard read late with every file current) is late; since 9-Oct-2026 one miss is enough, so a
# failed nightly run still shows on the site the same day. A run is booked to the cron named in its title (every
# scheduled workflow's run-name carries github.event.schedule since 16-Oct-2026), so a schedule GitHub starts hours late
# is never booked as a later one. The last step starts by hand every schedule GitHub has not started 40 minutes after its
# due time (scripts/watchdog/dispatch-missed.mjs; the Cloudflare Worker in tools/dispatcher/ does the same every ten
# minutes without depending on GitHub starting this workflow). If its own
# pipeline has no alert open, one "SOURCE DOWN: watchdog - <dashboard> refresh late" issue (label data-watchdog)
# is opened, which the owner's email routine sends like every "SOURCE DOWN: " issue; the first on-time check
# comments and closes it. A dashboard with price feeds listed in dashboards.json (Oracle) is "stale" when
# any of them is behind the exchange's last completed session (red, pulsing on the site) and gets one
# "SOURCE DOWN: watchdog - <dashboard> prices stale" issue, closed when every feed is current again.
#
# Read-only on every other workflow. Commits only site/status/refresh.json, rewritten at every check (it
# changes, or its time stamp is 11 hours old), about two deploys a day; the pages treat a stamp older than
# 14 hours as unverified, so a silent watchdog never leaves a stale "Al día" behind.
name: Data refresh watchdog
run-name: "${{ github.event_name == 'schedule' && format('{0} (cron {1})', github.workflow, github.event.schedule) || github.event_name == 'workflow_dispatch' && format('{0} (by hand)', github.workflow) || github.workflow }}"  # the cron that fired a scheduled run, read by the watchdog (scripts/watchdog/lib.mjs cronFromTitle)

on:
  schedule:
    - cron: "50 3,15 * * *"   # every 12 hours, after the evening and the morning refreshes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: write no status file, open or close no issue"
        type: boolean
        default: false

concurrency:
  group: data-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # read the runs; dispatch the refreshes GitHub dropped (last step)
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the watchdog rules
        run: node scripts/watchdog/selftest.mjs

      - name: Check every scheduled refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog/check.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the status file if it changed
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          git config user.name "data-watchdog[bot]"
          git config user.email "data-watchdog@users.noreply.github.com"
          git add site/status/refresh.json
          if git diff --cached --quiet; then
            echo "Status unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "watchdog: data status $(date -u +%Y-%m-%d\ %H:%M) UTC [skip actions]"
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push failed; rebasing and retrying ($i)"   # a merge that touches the workflow files starts every push-triggered refresh at once: main moved five times in a minute on 16-Oct-2026
            git pull --rebase origin main || true
            sleep $((i * 5))
          done
          exit 1

      - name: Start the scheduled refreshes GitHub dropped or is holding
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog/dispatch-missed.mjs
