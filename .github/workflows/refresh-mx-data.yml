name: Refresh Mexico fiscal data

on:
  schedule:
    # 19:30 UTC (13:30 Mexico City) on weekdays — after Banxico's 12:00 FIX fixing, the weekly
    # Tuesday reserves statement, the Thursday 13:00 policy announcements, and SHCP's monthly
    # public-finance release (30 days after month end, published in the afternoon).
    - cron: '30 19 * * 1-5'
  workflow_dispatch:        # manual run from the Actions tab; fill "probe" to run diagnostics instead
    inputs:
      probe:
        description: 'Diagnostics only (nothing written), e.g. "banxico-cuadro CG2 9; shcp-index" — see scripts/mx-fiscal/probe.mjs'
        required: false
        default: ''
      dry_run:
        description: 'Fetch and validate every series, print the summary, write and commit nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write      # the mx-fiscal-health issue opened by the freshness test

# One run at a time; other pages' refresh workflows have their own groups and never touch these paths.
concurrency:
  group: mx-fiscal-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Probe (diagnostics only)
        if: ${{ github.event.inputs.probe != '' }}
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: node scripts/mx-fiscal/probe.mjs "${{ github.event.inputs.probe }}"

      # Every series in tools/mx-fiscal/series.json: Banxico SIE (rates, FX, reserves, balance
      # sheet, government-securities holdings, SHCP public-finance flows republished in the SIE)
      # and SHCP's Estadísticas Oportunas open-data CSVs (SHRFSP, RFSP, public debt stocks).
      # A series that fails validation keeps its last good values and is flagged stale on the
      # page; the step fails (and GitHub emails the repository owner) only when a `required`
      # series has no usable data at all.
      - name: Fetch and validate every series
        id: fetch
        if: ${{ github.event.inputs.probe == '' }}
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: node scripts/mx-fiscal/fetch.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # The refreshed series land in main BEFORE anything else runs: on 8 and 9-Oct-2026 the fetch succeeded, the
      # document-mirror step below failed installing poppler-utils (GitHub's apt mirror answered 404 on the runner
      # image's stale package index) and, with the commit after it, the fresh data.js never reached main while the
      # freshness test read the fresh local file and reported "healthy". The watchdog reads this step's name
      # ("Commit …") to decide whether a failed run's refresh landed. Script: scripts/mx-fiscal/commit-push.sh.
      - name: Commit data.js if it changed
        id: commit
        if: ${{ github.event.inputs.probe == '' && github.event.inputs.dry_run != 'true' }}
        run: |
          bash scripts/mx-fiscal/commit-push.sh "chore: refresh Mexico fiscal data [skip actions]" site/mx/fiscal/data.js

      # Official documents (CGPE, PAF, LIF, PEF, Banxico announcements, Pemex IR…) mirrored as text
      # into tools/mx-fiscal/docs/ so the document routine reads primary sources. Never fails the job
      # (continue-on-error) and never holds the data for long (15 minutes; on 6-Oct-2026 an unreachable
      # host held the old single commit step for 44 minutes). pdftotext comes from poppler-utils; the
      # package index is refreshed first because the runner image's copy goes stale between image builds,
      # and a failed install only costs this run's PDF mirrors (mirror-docs.mjs keeps the previous text).
      - name: Mirror official documents as text
        if: ${{ github.event.inputs.probe == '' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if ! command -v pdftotext >/dev/null; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null 2>&1 \
              || echo "::warning::poppler-utils could not be installed; the PDF mirrors keep their previous text this run"
          fi
          node scripts/mx-fiscal/mirror-docs.mjs

      - name: Commit document mirrors if they changed
        if: ${{ github.event.inputs.probe == '' && github.event.inputs.dry_run != 'true' }}
        run: |
          bash scripts/mx-fiscal/commit-push.sh "chore: refresh Mexico fiscal document mirrors [skip actions]" tools/mx-fiscal/docs/

      # Document-sourced figures (docs-data.js) checked against the mirrored LIF, PEF, CGPE and PAF text.
      # Runs after the data commit so a drift never blocks the daily series; a mismatch fails the job,
      # which e-mails the owner, and the daily document routine corrects the value.
      - name: Cross-check docs-data.js against the mirrored documents
        if: ${{ github.event.inputs.probe == '' }}
        run: node scripts/mx-fiscal/check-docs.mjs

      # Freshness test (tools/mx-fiscal/freshness.json): every series the page shows must be newer than
      # its allowance, data.js itself must be under two business days old, and no series may be a kept
      # copy of an earlier run. It also fails when this run's fetch failed or its refreshed data.js could
      # not be pushed, so a run that never reached main cannot pass on the fresh local file. The page
      # shows the same verdict in amber in the reader's browser; this step fails the run and keeps one
      # mx-fiscal-health issue open until a healthy run closes it.
      - name: Freshness test
        id: freshness
        if: ${{ always() && github.event.inputs.probe == '' && github.event.inputs.dry_run != 'true' }}
        env:
          MX_FISCAL_FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          MX_FISCAL_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: node scripts/mx-fiscal/check-freshness.mjs

      - name: Open, update or close the mx-fiscal-health issue
        if: ${{ always() && github.event.inputs.probe == '' && github.event.inputs.dry_run != 'true' && github.ref_name == 'main' }}
        uses: actions/github-script@v7
        env:
          PROBLEMS: ${{ steps.freshness.outputs.problems }}
        with:
          script: |
            const label = 'mx-fiscal-health';
            const problems = (process.env.PROBLEMS || '').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 1 });
            const issue = open[0];
            if (problems) {
              const body = `Stale data on fnam.mx/mx/fiscal (${runUrl}). The page shows these blocks in amber meanwhile.\n\n\`\`\`\n${problems}\n\`\`\`\n\nAllowances: tools/mx-fiscal/freshness.json. Diagnostics: run the workflow with the "probe" input.`;
              if (issue) {
                const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number, per_page: 100 });
                const last = Date.parse(comments.length ? comments[comments.length - 1].created_at : issue.created_at);
                if (Date.now() - last > 20 * 3600 * 1000) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              } else {
                try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'e0a800', description: 'Mexico fiscal monitor data is stale' }); } catch (e) { /* exists */ }
                await github.rest.issues.create({ ...context.repo, title: 'SOURCE DOWN: MX fiscal - stale data', labels: [label], body });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Fresh again in ${runUrl}. Closing.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }

      # Source links. Every external link on the page (and in the data files it loads) is
      # requested once; a link that answers 404/410 or whose host no longer resolves fails the
      # run - after the commit above, so the refresh itself still lands - and GitHub e-mails the
      # owner. Hosts that refuse scripts (Bloomberg, BLS, FRED, GlobeNewswire ...) are listed as
      # notices and never fail the run. Script: scripts/check-links.mjs.
      - name: Check source links
        if: always()
        run: node scripts/check-links.mjs site/mx/fiscal/index.html
