name: Refresh Treasury/Fed data

on:
  schedule:
    # 13:15 UTC daily (after Treasury's morning data release and the FRED overnight update)
    - cron: '15 13 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Treasury + FRED figures
        run: node scripts/fetch-data.mjs

      - name: Commit updated data.js if it changed
        run: |
          git config user.name "fnam-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/fiscal/data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh live Treasury/Fed data [skip ci]"
            git push
          fi
