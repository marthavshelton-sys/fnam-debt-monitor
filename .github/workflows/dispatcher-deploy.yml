# Deploys the Cloudflare Worker in tools/dispatcher/ (the clock outside GitHub that starts the scheduled refreshes GitHub drops
# or holds; rule in scripts/watchdog/dispatch-lib.mjs, runbook tools/dispatcher/README.md). Runs by hand and on every merge
# that touches the Worker or the rule it bundles. Needs two repository secrets the owner creates once (README → "Deploy"):
#   CLOUDFLARE_API_TOKEN      a Cloudflare API token with "Workers Scripts: Edit" on the account that serves fnam.mx
#   DISPATCHER_GITHUB_TOKEN   a fine-grained GitHub token, this repository only, Actions: Read and write, Metadata: Read
#   FRED_PROXY_KEY            a random string the FRED proxy route requires (README → "FRED proxy"); the refresh workflows
#                             send it as X-FNAM-Key, and the Worker gets it as its PROXY_KEY secret
# The last two are uploaded to the Worker as its GITHUB_TOKEN and PROXY_KEY secrets on every deploy, so rotating either is
# one secret change here plus a dispatch of this workflow. The account id is in tools/dispatcher/wrangler.toml (not a secret).
name: Deploy the dispatcher Worker
run-name: "${{ github.workflow }} (${{ github.event_name == 'workflow_dispatch' && 'by hand' || 'merge' }})"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/dispatcher/**"
      - "scripts/watchdog/lib.mjs"
      - "scripts/watchdog/dispatch-lib.mjs"
      - ".github/workflows/dispatcher-deploy.yml"

concurrency:
  group: dispatcher-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to write the repository variable FRED_PROXY_URL after the deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Self-test the rule the Worker bundles
        run: node scripts/watchdog/selftest.mjs

      - name: Check the secrets are set
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH: ${{ secrets.DISPATCHER_GITHUB_TOKEN }}
          PK: ${{ secrets.FRED_PROXY_KEY }}
        run: |
          missing=""
          [ -n "$CF" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$GH" ] || missing="$missing DISPATCHER_GITHUB_TOKEN"
          [ -n "$PK" ] || missing="$missing FRED_PROXY_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing. Create them as tools/dispatcher/README.md describes, then run this workflow again."
            exit 1
          fi

      - name: Deploy the Worker and upload its GitHub token
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: tools/dispatcher
          command: deploy
          secrets: |
            GITHUB_TOKEN
            PROXY_KEY
        env:
          GITHUB_TOKEN: ${{ secrets.DISPATCHER_GITHUB_TOKEN }}
          PROXY_KEY: ${{ secrets.FRED_PROXY_KEY }}

      # The refresh workflows reach the FRED proxy through the repository variable FRED_PROXY_URL; it is written here from
      # the address wrangler reports, so a deploy always leaves it right and nobody has to copy it by hand (22-Oct-2026).
      - name: Record the Worker's address as the repository variable FRED_PROXY_URL
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = (process.env.URL || '').trim().replace(/\/+$/, '');
            const name = 'FRED_PROXY_URL';
            // Reports on the "Runner diagnostics" issue as well, since a session cannot read this log.
            const report = async (text) => {
              try {
                const open = await github.rest.issues.listForRepo({ ...context.repo, labels: 'runner-diagnostics', state: 'open', per_page: 1 });
                if (open.data[0]) await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body: `**${context.workflow}** · ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC\n\n${text}` });
              } catch (e) { console.log('could not post the report: ' + e.message); }
            };
            if (!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/.test(url)) { const m = `wrangler reported no workers.dev address (deployment-url = "${url}"): set the repository variable ${name} by hand (tools/dispatcher/README.md → FRED proxy)`; await report(m); core.setFailed(m); return; }
            try {
              try { await github.rest.actions.updateRepoVariable({ ...context.repo, name, value: url }); }
              catch (e) { if (e.status === 404) await github.rest.actions.createRepoVariable({ ...context.repo, name, value: url }); else throw e; }
              await report(`${name} = ${url} (written)`);
              console.log(`${name} = ${url}`);
            } catch (e) {
              const m = `could not write the repository variable ${name} = ${url}: HTTP ${e.status || ''} ${e.message}. Set it by hand (Settings → Secrets and variables → Actions → Variables).`;
              await report(m); core.setFailed(m);
            }

      - name: What to look at
        run: echo "Deployed. Cloudflare dashboard → Workers & Pages → fnam-dispatcher → Logs shows one line every ten minutes; GitHub → Actions shows the runs it starts as '(by hand)' runs on main. The repository variable FRED_PROXY_URL now carries the Worker's address (tools/dispatcher/README.md → FRED proxy)."
