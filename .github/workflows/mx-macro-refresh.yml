# Keeps the Mexico macro dashboard (site/mx/macro) current.
#
#   1. scripts/mx-macro/fetch.mjs pulls every series in tools/mx-macro/series.json from Banxico's
#      SIE API (primary) and FRED (fallback) into tools/mx-macro/data/series.json. A series that
#      fails keeps its last committed points; a series whose title doesn't match the manifest is
#      dropped and reported, so a wrong ID never reaches the page.
#   2. scripts/mx-macro/build.mjs bakes that data into the page and writes site/mx/macro/index.html
#      (only when the data or template changed). Cloudflare Pages deploys the commit.
#
# Schedule (Mexico City is UTC-6 all year since 2022): INEGI publishes at 06:00 local = 12:00 UTC,
# Banxico's FIX around 12:00 local = 18:00 UTC, and policy decisions at 13:00 local = 19:00 UTC.
# Runs at 12:25, 18:25 and 19:25 UTC on weekdays; nothing is committed when nothing changed.
#
# Required repository secrets: BANXICO_TOKEN (free, https://www.banxico.org.mx/SieAPIRest/service/v1/token)
# and INEGI_TOKEN (free registration, https://www.inegi.org.mx/app/desarrolladores/generatoken/Usuarios/token_Verify)
# for IGAE and consumer confidence. Optional: FRED_API_KEY (lets the fetcher verify FRED titles).
#
# Diagnostics: run the workflow by hand with the "probe" or "catalog" input filled in and nothing
# is fetched or committed; the run summary shows what each id is / which INEGI ids match a name.
#
# Scheduled runs only happen on the default branch (GitHub rule). On other branches the workflow
# runs when its scripts change (bootstrap) or on manual dispatch. Bot commits carry [skip ci].
name: Refresh Mexico macro dashboard

on:
  schedule:
    - cron: "25 12 * * 1-5"
    - cron: "25 18,19 * * 1-5"
  workflow_dispatch:
    inputs:
      probe:
        description: "Diagnostics only: comma list of provider:id to describe, e.g. inegi:496150,banxico:SP1"
        default: ""
      catalog:
        description: "Diagnostics only: search INEGI's indicator catalog by description (regex, accents ignored)"
        default: ""
  push:
    branches: ["main", "claude/mexico-macro-dashboard-fnam-3m65pe"]
    paths:
      - "scripts/mx-macro/**"
      - "tools/mx-macro/series.json"
      - "tools/mx-macro/template.html"
      - ".github/workflows/mx-macro-refresh.yml"

concurrency:
  group: mx-macro-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Series diagnostics (probe / catalog search)
        if: github.event.inputs.probe != '' || github.event.inputs.catalog != ''
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          PROBE: ${{ github.event.inputs.probe }}
          CATALOG: ${{ github.event.inputs.catalog }}
        run: |
          ARGS=()
          if [ -n "$PROBE" ]; then ARGS+=(--probe "$PROBE"); fi
          if [ -n "$CATALOG" ]; then ARGS+=(--catalog "$CATALOG"); fi
          node scripts/mx-macro/fetch.mjs "${ARGS[@]}"

      - name: Fetch series (Banxico SIE, FRED, INEGI)
        if: github.event.inputs.probe == '' && github.event.inputs.catalog == ''
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        run: |
          if [ -z "$BANXICO_TOKEN" ]; then echo "::warning::BANXICO_TOKEN secret is not set - only the FRED fallbacks can be fetched (inflation components, remittances, policy rates and reserves will be missing)"; fi
          node scripts/mx-macro/fetch.mjs

      # Runs even if a fetch failed, so whatever did refresh still reaches the page.
      - name: Build page
        if: always() && github.event.inputs.probe == '' && github.event.inputs.catalog == ''
        run: node scripts/mx-macro/build.mjs

      - name: Commit if anything changed
        if: always() && github.event.inputs.probe == '' && github.event.inputs.catalog == ''
        shell: bash
        run: |
          git config user.name "mx-macro-refresh[bot]"
          git config user.email "mx-macro-refresh@users.noreply.github.com"
          git add site/mx/macro/index.html tools/mx-macro/data
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
            exit 0
          fi
          git commit -m "mx-macro: refresh $(date -u +%Y-%m-%d\ %H:%M) UTC [skip ci]"
          for i in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            echo "push failed; rebasing and retrying ($i)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((i * 5))
          done
          exit 1
