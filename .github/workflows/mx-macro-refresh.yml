# Keeps the Mexico macro dashboard (site/mx/macro) current.
#
#   1. scripts/mx-macro/fetch.mjs pulls every series in tools/mx-macro/series.json from Banxico's
#      SIE API (primary) and FRED (fallback) into tools/mx-macro/data/series.json. A series that
#      fails keeps its last committed points; a series whose title doesn't match the manifest is
#      dropped and reported, so a wrong ID never reaches the page.
#   2. scripts/mx-macro/build.mjs bakes that data into the page and writes site/mx/macro/index.html
#      (only when the data or template changed). Cloudflare Pages deploys the commit.
#
# Schedule (Mexico City is UTC-6 all year since 2022): INEGI publishes at 06:00 local = 12:00 UTC,
# Banxico's FIX around 12:00 local = 18:00 UTC, and policy decisions at 13:00 local = 19:00 UTC.
# Runs at 12:25, 18:25 and 19:25 UTC on weekdays, plus 15:25 UTC on Saturday and Sunday (the
# sources publish nothing on weekends, but the run catches corrections and late postings);
# nothing is committed when nothing changed.
#
# Health alarm: after every refresh, scripts/mx-macro/health.mjs flags any series no provider
# has answered for in 7 days (the page silently keeps old data in that case), and the last step
# opens - or comments on - a GitHub issue labeled mx-macro-health when the run failed or a
# series is stale. The first healthy run afterwards closes the issue.
#
# Required repository secrets: BANXICO_TOKEN (free, https://www.banxico.org.mx/SieAPIRest/service/v1/token)
# and INEGI_TOKEN (free registration, https://www.inegi.org.mx/app/desarrolladores/generatoken/Usuarios/token_Verify)
# for IGAE and consumer confidence. Optional: FRED_API_KEY (lets the fetcher verify FRED titles).
#
# Diagnostics: run the workflow by hand with the "probe" or "catalog" input filled in and nothing
# is fetched or committed; the run summary shows what each id is / which INEGI ids match a name.
#
# Scheduled runs only happen on the default branch (GitHub rule). On other branches the workflow
# runs when its scripts change (bootstrap) or on manual dispatch. Bot commits carry
# [skip actions]: it stops Actions from re-triggering but, unlike [skip ci], is not one of
# Cloudflare Pages' skip markers, so every refresh commit actually deploys.
name: Refresh Mexico macro dashboard

on:
  schedule:
    - cron: "25 12 * * 1-5"
    - cron: "25 18,19 * * 1-5"
    - cron: "25 15 * * 0,6"
  workflow_dispatch:
    inputs:
      probe:
        description: "Diagnostics only: comma list of provider:id to describe, e.g. inegi:496150,banxico:SP1"
        default: ""
      catalog:
        description: "Diagnostics only: search INEGI's indicator catalog by description (regex, accents ignored)"
        default: ""
      url:
        description: "Diagnostics only: whitespace-separated URLs to fetch and print ({INEGI_TOKEN} etc. substituted)"
        default: ""
      xlsx:
        description: "Diagnostics only: URL#regex of a workbook whose matching rows to print"
        default: ""
      search:
        description: "Diagnostics only: BIE full-text search terms separated by |, prints indicator ids and titles"
        default: ""
      post:
        description: "Diagnostics only: 'URL {json}' pairs separated by ;; sent as JSON POST requests"
        default: ""
  push:
    branches: ["main", "claude/mexico-macro-dashboard-fnam-3m65pe"]
    paths:
      - "scripts/mx-macro/**"
      - "tools/mx-macro/series.json"
      - "tools/mx-macro/template.html"
      - ".github/workflows/mx-macro-refresh.yml"

concurrency:
  group: mx-macro-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Series diagnostics (probe / catalog search)
        if: github.event.inputs.probe != '' || github.event.inputs.catalog != '' || github.event.inputs.url != '' || github.event.inputs.xlsx != '' || github.event.inputs.search != '' || github.event.inputs.post != ''
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          PROBE: ${{ github.event.inputs.probe }}
          CATALOG: ${{ github.event.inputs.catalog }}
          URLS: ${{ github.event.inputs.url }}
          XLSX: ${{ github.event.inputs.xlsx }}
          SEARCH: ${{ github.event.inputs.search }}
          POSTS: ${{ github.event.inputs.post }}
        run: |
          ARGS=()
          if [ -n "$PROBE" ]; then ARGS+=(--probe "$PROBE"); fi
          if [ -n "$CATALOG" ]; then ARGS+=(--catalog "$CATALOG"); fi
          if [ -n "$URLS" ]; then ARGS+=(--url "$URLS"); fi
          if [ -n "$XLSX" ]; then ARGS+=(--xlsx "$XLSX"); fi
          if [ -n "$SEARCH" ]; then ARGS+=(--search "$SEARCH"); fi
          if [ -n "$POSTS" ]; then ARGS+=(--post "$POSTS"); fi
          node scripts/mx-macro/fetch.mjs "${ARGS[@]}"

      - name: Fetch series (Banxico SIE, FRED, INEGI)
        id: fetch
        if: github.event.inputs.probe == '' && github.event.inputs.catalog == '' && github.event.inputs.url == '' && github.event.inputs.xlsx == '' && github.event.inputs.search == '' && github.event.inputs.post == ''
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
        run: |
          if [ -z "$BANXICO_TOKEN" ]; then echo "::warning::BANXICO_TOKEN secret is not set - only the FRED fallbacks can be fetched (inflation components, remittances, policy rates and reserves will be missing)"; fi
          node scripts/mx-macro/fetch.mjs

      # Runs even if a fetch failed, so whatever did refresh still reaches the page.
      - name: Build page
        id: build
        if: always() && github.event.inputs.probe == '' && github.event.inputs.catalog == '' && github.event.inputs.url == '' && github.event.inputs.xlsx == '' && github.event.inputs.search == '' && github.event.inputs.post == ''
        run: node scripts/mx-macro/build.mjs

      - name: Commit if anything changed
        id: commit
        if: always() && github.event.inputs.probe == '' && github.event.inputs.catalog == '' && github.event.inputs.url == '' && github.event.inputs.xlsx == '' && github.event.inputs.search == '' && github.event.inputs.post == ''
        shell: bash
        run: |
          git config user.name "mx-macro-refresh[bot]"
          git config user.email "mx-macro-refresh@users.noreply.github.com"
          git add site/mx/macro/index.html tools/mx-macro/data
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
            exit 0
          fi
          git commit -m "mx-macro: refresh $(date -u +%Y-%m-%d\ %H:%M) UTC [skip actions]"
          for i in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            echo "push failed; rebasing and retrying ($i)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((i * 5))
          done
          exit 1

      # fetchedAt only advances when a provider answers, so this catches a dead token or a
      # changed API even though the page keeps its last good data and the run stays green.
      - name: Data health check
        id: health
        if: always() && github.event.inputs.probe == '' && github.event.inputs.catalog == '' && github.event.inputs.url == '' && github.event.inputs.xlsx == '' && github.event.inputs.search == '' && github.event.inputs.post == ''
        run: node scripts/mx-macro/health.mjs

      - name: Open, update or close the mx-macro-health issue
        if: always() && github.event.inputs.probe == '' && github.event.inputs.catalog == '' && github.event.inputs.url == '' && github.event.inputs.xlsx == '' && github.event.inputs.search == '' && github.event.inputs.post == ''
        uses: actions/github-script@v7
        env:
          PROBLEMS: ${{ steps.health.outputs.problems }}
          RUN_FAILED: ${{ steps.fetch.conclusion == 'failure' || steps.build.conclusion == 'failure' || steps.commit.conclusion == 'failure' || steps.health.conclusion == 'failure' }}
        with:
          script: |
            const label = 'mx-macro-health';
            const problems = (process.env.PROBLEMS || '').trim();
            const failed = process.env.RUN_FAILED === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 1 });
            const issue = open[0];
            if (failed || problems) {
              const body = [
                failed ? `A refresh run failed: ${runUrl}` : `A refresh run succeeded but some series are stale: ${runUrl}`,
                problems ? '\n```\n' + problems + '\n```' : '',
                '\nThe page keeps its last good data meanwhile. tools/mx-macro/README.md documents the diagnostics inputs for finding the cause.',
              ].join('\n');
              if (issue) {
                // At most one comment per ~20h so three failing runs a day do not triple-notify.
                const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number, per_page: 100 });
                const lastTouched = Date.parse(comments.length ? comments[comments.length - 1].created_at : issue.created_at);
                if (Date.now() - lastTouched > 20 * 3600 * 1000) {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
                } else {
                  core.info('Open issue already updated recently; not commenting again.');
                }
              } else {
                try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Mexico macro dashboard refresh needs attention' }); } catch (e) { /* exists */ }
                await github.rest.issues.create({ ...context.repo, title: 'Mexico macro dashboard: refresh needs attention', labels: [label], body });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Healthy again: every series answered by a provider in ${runUrl}. Closing.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            } else {
              core.info('Healthy and no open issue; nothing to do.');
            }
