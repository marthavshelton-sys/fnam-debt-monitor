# One-off discovery probe for the ASUR / OMA models (see scripts/airports/probe.mjs).
name: Probe ASUR/OMA sources
on:
  workflow_dispatch:
  push:
    branches: ["claude/gap-financial-model-vfypi1"]
    paths: ["scripts/airports/probe.mjs", ".github/workflows/airports-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/airports/probe.mjs
      - shell: bash
        run: |
          git config user.name "gap-refresh[bot]"
          git config user.email "gap-refresh@users.noreply.github.com"
          git add tools/airports/probe
          git diff --cached --quiet && exit 0
          git commit -m "airports: source probe $(date -u +%Y-%m-%d\ %H:%M) UTC [skip actions]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push origin HEAD:${GITHUB_REF_NAME}
