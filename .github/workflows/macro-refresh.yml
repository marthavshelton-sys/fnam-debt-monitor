# Rebuilds site/macro/index.html from every upstream source and commits it
# when the data changed. Cloudflare Pages deploys the commit automatically,
# the same way it does for the fiscal monitor.
#
# Schedule: 12:50 UTC on weekdays, 14:05 and 20:05 UTC every day. Most US
# releases land at 08:30 ET. The 12:50 run is 20 minutes after that during
# daylight time (and harmlessly before it in winter - nothing changes, nothing
# is committed); the 14:05 run is the safety net in either season; 20:05
# catches afternoon releases and same-day revisions. Weekend runs pick up
# anything posted off-cycle (Shiller's file, DOE's inventory report).
# Two weekly releases get their own runs: EIA's petroleum report (Wednesdays
# 10:30 ET) at 14:45 and 15:45 UTC on Wednesdays - 10:45 and 11:45 ET in
# daylight time, 09:45 (a no-op) and 10:45 ET in winter - and, for EIA's
# holiday weeks (Thursday, 12:00 ET) and Freddie Mac's mortgage survey
# (Thursdays, 12:00 ET), 17:20 UTC on Thursdays.
#
# This job only ever writes site/macro/index.html, site/macro/spr-inventory.jpg,
# site/macro/status.json and tools/macro/data/**; it never touches another
# page's files or workflow.
name: Refresh macro dashboard

on:
  schedule:
    - cron: "50 12 * * 1-5"
    - cron: "5 14,20 * * *"
    - cron: "45 14,15 * * 3"
    - cron: "20 17 * * 4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/macro/**"
      - ".github/workflows/macro-refresh.yml"

concurrency:
  group: macro-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      # Windows git defaults to core.autocrlf=true, which makes files that other
      # tools committed with CRLF show as modified the moment they are checked
      # out - and a dirty tree blocks the rebase before pushing. Keep bytes as
      # committed instead.
      - run: git config --global core.autocrlf false
        shell: bash
      # ref: main, not the commit that triggered the run. Runs are serialised by
      # the concurrency group, so a queued run would otherwise start from a
      # commit the previous run has already built on and conflict with it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # xlrd converts legacy .xls workbooks (NY Fed GSCPI, EIA SPR history,
      # Shiller's data set); PyMuPDF reads the Challenger report's tables;
      # RapidOCR reads DOE's SPR inventory report, which is only an image.
      # The rest of the pipeline is Windows PowerShell 5.1, which the runner ships.
      - run: pip install xlrd==2.0.1 pymupdf==1.25.5 rapidocr-onnxruntime==1.4.4

      - name: Refresh data and build page
        id: refresh
        shell: powershell
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          MACRO_DATA_DIR: ${{ github.workspace }}\tools\macro\data
        run: |
          .\tools\macro\refresh_all.ps1 -OutFile "$env:GITHUB_WORKSPACE\site\macro\index.html"

      # New releases since the last run become a GitHub issue whose body is the
      # page's own "At a glance" text for each section. The issue is a queue:
      # the Claude Routine "FNAM US Macro: email material changes" emails the
      # MATERIAL ones to the owner (tools/macro/README.md). State lives in
      # tools/macro/data/alerts_state.json and is committed with the data.
      - name: Email material updates (as a GitHub issue)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MACRO_DATA_DIR: ${{ github.workspace }}\tools\macro\data
        run: |
          .\tools\macro\alerts.ps1 -Page "$env:GITHUB_WORKSPACE\site\macro\index.html"

      - name: Commit if the data changed
        shell: bash
        run: |
          git config user.name "macro-refresh[bot]"
          git config user.email "macro-refresh@users.noreply.github.com"
          # The data folder is committed in full: each processed file is the
          # last-good copy a later run falls back to if that source is down.
          git add site/macro/index.html site/macro/spr-inventory.jpg site/macro/status.json tools/macro/data
          if git diff --cached --quiet; then
            echo "No data change since the last build; nothing to commit."
          else
            git commit -m "macro: refresh $(date -u +%Y-%m-%d\ %H:%M) UTC"
            # Other workflows commit to main as well; rebase onto whatever landed
            # in the meantime and try again instead of failing on a non-fast-forward.
            # --autostash: the runner's checkout can show unrelated files as
            # modified (line-ending normalisation), which makes a plain rebase
            # refuse to run. A push that never lands must fail the run, not
            # hide behind a green check.
            git status --short | head -20
            # Everything this run produced is already committed; anything else
            # left modified in the tree is checkout noise and must not block the rebase.
            git checkout -- . 2>/dev/null || true
            # Files another project committed with one line ending and rewrites to
            # another on checkout stay "modified" no matter what; mark whatever is
            # still dirty as skip-worktree so the rebase ignores it. Nothing outside
            # the paths added above is ever committed by this job.
            dirty=$(git diff --name-only)
            if [ -n "$dirty" ]; then echo "$dirty" | xargs -r git update-index --skip-worktree; echo "skip-worktree: $dirty"; fi
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push; then pushed=1; break; fi
              else
                # Only this job writes site/macro and tools/macro/data, so a
                # conflict there means an earlier macro run landed first. This
                # run's output is the newer complete state: keep it and go on.
                git checkout --theirs -- site/macro tools/macro/data 2>/dev/null || true
                git add -A site/macro tools/macro/data
                if (GIT_EDITOR=true git rebase --continue || git rebase --skip) && git push; then pushed=1; break; fi
                git rebase --abort 2>/dev/null || true
              fi
              echo "push attempt $i failed; retrying in 20s"; sleep 20
            done
            if [ "$pushed" != "1" ]; then echo "::error::refresh was built but could not be pushed after 3 attempts"; exit 1; fi
          fi

      # Source-down alert. refresh_all.ps1 sets `stuck` when a source has failed
      # three runs in a row or a staleness warning has persisted that long. The
      # owner does not get GitHub's notification mail, so this opens ONE issue
      # titled "SOURCE DOWN: ..." per outage (never a second while one is open)
      # and the Claude Routine that emails MATERIAL alerts emails it too. The
      # first healthy run afterwards closes it. See tools/macro/README.md.
      - name: Open or close the source-down issue
        if: always() && steps.refresh.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STUCK: ${{ steps.refresh.outputs.stuck }}
        with:
          script: |
            const label = 'macro-source-down';
            const stuck = (process.env.STUCK || '').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 1 });
            const issue = open[0];
            if (stuck) {
              if (issue) { core.info(`Source-down issue #${issue.number} already open; not opening another.`); return; }
              try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'US macro dashboard: a source has been down for three runs' }); } catch (e) { /* exists */ }
              const short = stuck.length > 150 ? stuck.slice(0, 147) + '...' : stuck;
              const body = [
                `The US macro dashboard refresh has had a source failing (or a staleness warning) for three runs in a row: ${runUrl}`,
                '',
                '- **What is down:** ' + stuck,
                '- **Effect:** the page keeps showing the last good data for that source; everything else keeps refreshing.',
                '- **What to do:** usually nothing; most outages clear on their own. If it persists for days, ask Claude to diagnose it (runbook: tools/macro/README.md).',
                '',
                'This issue closes automatically on the first healthy run.',
              ].join('\n');
              await github.rest.issues.create({ ...context.repo, title: 'SOURCE DOWN: US macro - ' + short, labels: [label], body });
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `All sources healthy again in ${runUrl}. Closing.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            } else {
              core.info('No source down and no open issue; nothing to do.');
            }

      # The page is already committed with last-good data for the broken
      # source; failing the run as well keeps the outage visible in the
      # Actions history.
      - name: Fail the run if a source has been down for three runs
        if: steps.refresh.outputs.stuck != ''
        shell: bash
        run: |
          echo "::error::${{ steps.refresh.outputs.stuck }}"
          exit 1

      # Source links. Every external link on the page (and in the data files it loads) is
      # requested once; a link that answers 404/410 or whose host no longer resolves fails the
      # run - after the commit above, so the refresh itself still lands - and GitHub e-mails the
      # owner. Hosts that refuse scripts (Bloomberg, BLS, FRED, GlobeNewswire ...) are listed as
      # notices and never fail the run. Script: scripts/check-links.mjs.
      - name: Check source links
        if: always()
        run: node scripts/check-links.mjs site/macro/index.html
