# Rebuilds site/macro/index.html from every upstream source and commits it
# when the data changed. Cloudflare Pages deploys the commit automatically,
# the same way it does for the fiscal monitor.
#
# Schedule: 12:50, 14:05 and 20:05 UTC on weekdays. Most US releases land at
# 08:30 ET. The 12:50 run is 20 minutes after that during daylight time (and
# harmlessly before it in winter - nothing changes, nothing is committed); the
# 14:05 run is the safety net in either season; 20:05 catches afternoon
# releases and same-day revisions.
name: Refresh macro dashboard

on:
  schedule:
    - cron: "50 12 * * 1-5"
    - cron: "5 14,20 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/macro/**"
      - ".github/workflows/macro-refresh.yml"

concurrency:
  group: macro-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      # Windows git defaults to core.autocrlf=true, which makes files that other
      # tools committed with CRLF show as modified the moment they are checked
      # out - and a dirty tree blocks the rebase before pushing. Keep bytes as
      # committed instead.
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # xlrd converts legacy .xls workbooks (NY Fed GSCPI, EIA SPR history,
      # Shiller's data set); PyMuPDF reads the Challenger report's tables.
      # The rest of the pipeline is Windows PowerShell 5.1, which the runner ships.
      - run: pip install xlrd==2.0.1 pymupdf==1.25.5

      - name: Refresh data and build page
        id: refresh
        shell: powershell
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          MACRO_DATA_DIR: ${{ github.workspace }}\tools\macro\data
        run: |
          .\tools\macro\refresh_all.ps1 -OutFile "$env:GITHUB_WORKSPACE\site\macro\index.html"

      # New releases since the last run become a GitHub issue whose body is the
      # page's own "At a glance" text for each section; GitHub emails the
      # repository owner about it. The issue is only the delivery channel - no
      # mail server, no credentials, nothing on anyone's computer. State lives
      # in tools/macro/data/alerts_state.json and is committed with the data.
      - name: Email material updates (as a GitHub issue)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MACRO_DATA_DIR: ${{ github.workspace }}\tools\macro\data
        run: |
          .\tools\macro\alerts.ps1 -Page "$env:GITHUB_WORKSPACE\site\macro\index.html"

      - name: Commit if the data changed
        shell: bash
        run: |
          git config user.name "macro-refresh[bot]"
          git config user.email "macro-refresh@users.noreply.github.com"
          # The data folder is committed in full: each processed file is the
          # last-good copy a later run falls back to if that source is down.
          git add site/macro/index.html site/macro/spr-inventory.jpg tools/macro/data
          if git diff --cached --quiet; then
            echo "No data change since the last build; nothing to commit."
          else
            git commit -m "macro: refresh $(date -u +%Y-%m-%d\ %H:%M) UTC"
            # Other workflows commit to main as well; rebase onto whatever landed
            # in the meantime and try again instead of failing on a non-fast-forward.
            # --autostash: the runner's checkout can show unrelated files as
            # modified (line-ending normalisation), which makes a plain rebase
            # refuse to run. A push that never lands must fail the run, not
            # hide behind a green check.
            git status --short | head -20
            # Everything this run produced is already committed; anything else
            # left modified in the tree is checkout noise and must not block the rebase.
            git checkout -- . 2>/dev/null || true
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              echo "push attempt $i failed; retrying in 20s"; sleep 20
            done
            if [ "$pushed" != "1" ]; then echo "::error::refresh was built but could not be pushed after 3 attempts"; exit 1; fi
          fi

      # The page is already committed with last-good data for the broken
      # source; failing the run here is only so GitHub sends its "run failed"
      # email to the repository owner. refresh_all.ps1 sets `stuck` when a
      # source has failed three runs in a row or a staleness warning has
      # persisted that long.
      - name: Fail the run if a source has been down for three runs
        if: steps.refresh.outputs.stuck != ''
        shell: bash
        run: |
          echo "::error::${{ steps.refresh.outputs.stuck }}"
          exit 1
