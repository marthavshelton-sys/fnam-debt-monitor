# Cloudflare Worker that starts the scheduled refreshes GitHub dropped or is holding (worker.mjs; README.md for the deploy).
# Deployed by .github/workflows/dispatcher-deploy.yml (by hand, and on every merge that touches the Worker); from a
# computer with wrangler logged in: `npx wrangler deploy --config tools/dispatcher/wrangler.toml`.
name = "fnam-dispatcher"
account_id = "ec65d18ab23f355cb013ece4e9b26e6c"   # the Cloudflare account that serves fnam.mx (the id in the Pages project's dashboard URL; not a secret)
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true   # the FRED proxy and the GET / report need a URL: https://fnam-dispatcher.<account subdomain>.workers.dev (README → "FRED proxy")

[triggers]
crons = ["*/10 * * * *"]

[vars]
REPO = "marthavshelton-sys/fnam-debt-monitor"
LEAD_MINUTES = "40"

[observability]
enabled = true
